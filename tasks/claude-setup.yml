- name: Check whether Claude Code is installed
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.local/bin/claude"
  register: claude_binary

- name: Install Claude Code CLI locally
  ansible.builtin.command:
    cmd: npm install --global --prefix "{{ ansible_user_dir }}/.local" @anthropic-ai/claude-code
  environment:
    HOME: "{{ ansible_user_dir }}"
  when: not claude_binary.stat.exists

- name: Ensure .claude directory exists
  file:
    dest: "{{ home }}/.claude"
    state: directory
    mode: "0755"
  tags:
    - install
    - claude

- name: Install Claude API key
  copy:
    src: "./.claude/api_key"
    dest: "{{ home }}/.claude/api_key"
    mode: "0600"
  tags:
    - install
    - claude
